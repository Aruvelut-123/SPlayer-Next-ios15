name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ios-ipados
    paths:
      - ".github/workflows/ios-unsigned.yml"
      - ".github/workflows/build-ios-ipa.yml"
      - ".github/workflows/ci.yml"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "eslint.config.*"
      - ".prettierignore"
      - "components.d.ts"
      - "auto-imports.d.ts"
      - "scripts/ios-audio-tests/**"
      - "scripts/ios-lyric-tests/**"
      - "scripts/ios-seek-tests/**"
      - "scripts/verify-mobile-bundle.ts"
      - "src/**"
      - "electron/main/**"
      - "windows/shared/**"
      - "scripts/ios-update-tests/**"
      - "scripts/ios-siri-tests/**"
      - "scripts/configure-ios-siri.mjs"
      - "scripts/publish-action-update.cjs"
      - "scripts/optimize-ios-ipa.py"
      - "src-tauri/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "vite.config.ts"
      - "vite.siri.config.ts"
      - "uno.config.ts"

permissions:
  contents: read

concurrency:
  # 同一分支只保留最新构建，避免连续提交占满 macOS runner。
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks
    uses: ./.github/workflows/ci.yml

  build-ios:
    name: Unsigned iPhone and iPad IPA
    uses: ./.github/workflows/build-ios-ipa.yml
    with:
      ref: ${{ github.sha }}
      artifact-name: SPlayer-Next-iOS-unsigned-${{ github.sha }}
      ipa-name: SPlayer-Next-iOS-unsigned.ipa
      retention-days: 14

  publish-action:
    name: Publish Action update channel
    needs: [checks, build-ios]
    if: github.repository == 'Aruvelut-123/SPlayer-Next-ios15' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-ios-action-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SPlayer-Next-iOS-unsigned-${{ github.sha }}
      - uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-action-update.cjs');
            await publish({ github, context });
