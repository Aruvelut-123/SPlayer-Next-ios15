# tag（v*）触发
# 只构建 iOS / iPadOS 未签名 IPA → 创建 GitHub Release
# iOS 端的更新检测直接读 GitHub Releases API（见 src/mobile/update.ts），
# 因此这里必须把 IPA 作为 Release 资源上传，并维护稳定版 / beta / alpha 的
# prerelease 语义，客户端才能正确识别通道与版本。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v1.1.0-beta.1 或 v1.1.0-alpha.1）"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 22.x
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# 同一个 tag 的发布串行执行，避免并发上传资源产生竞态
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # 解析 package.json 版本：校验标签一致，并供 IPA 命名使用
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # v* 标签必须与 package.json 版本一致，客户端按标签名解析版本号
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "标签 $RELEASE_TAG 与 package.json 版本 v$VERSION 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 唯一的构建产物：未签名 iOS / iPadOS IPA
  build-ios:
    name: Unsigned iPhone and iPad IPA
    needs: resolve-version
    uses: ./.github/workflows/build-ios-ipa.yml
    with:
      ref: ${{ env.RELEASE_TAG }}
      artifact-name: SPlayer-Next-iOS-unsigned
      ipa-name: SPlayer-Next-iOS-unsigned-${{ needs.resolve-version.outputs.version }}.ipa

  # 把 IPA 挂到 GitHub Release，供客户端检测更新并下载
  release:
    name: Create GitHub Release
    needs: [resolve-version, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: SPlayer-Next-iOS-unsigned
          path: release-assets

      # 资源命名必须与客户端匹配规则一致：
      # 稳定期用 SPlayer-Next-iOS-unsigned-<版本>.ipa，Action 通道用固定名
      - name: Verify release assets
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-alpha|*-alpha.*)
              echo "UPDATE_CHANNEL=alpha" >> "$GITHUB_ENV"
              ;;
            *-beta|*-beta.*)
              echo "UPDATE_CHANNEL=beta" >> "$GITHUB_ENV"
              ;;
            *-*)
              echo "不支持的预发布版本格式: $VERSION"
              exit 1
              ;;
            *)
              echo "UPDATE_CHANNEL=latest" >> "$GITHUB_ENV"
              ;;
          esac

          expected="SPlayer-Next-iOS-unsigned-$VERSION.ipa"
          if [ ! -f "release-assets/$expected" ]; then
            echo "缺少 iOS 产物: $expected"
            ls -1R release-assets
            exit 1
          fi
          echo "待发布资源："
          ls -1 release-assets

      # 用官方 gh CLI 确定性创建 Release
      # 正式版保持草稿，预览版直接发布为 prerelease（客户端据此区分通道）
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 重跑场景：若同名 release 已存在则先删除，避免脏状态（保留 tag）
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if [ "$UPDATE_CHANNEL" != "latest" ]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --prerelease \
              release-assets/*
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --draft \
              release-assets/*
          fi
